<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>RHACS UX Prototypes</title>
  <script>
    // GitHub Pages SPA redirect: encode the current path/search/hash into
    // sessionStorage, then redirect to the app root which will restore it.
    (function () {
      var l = window.location;
      // Only redirect paths that are under /app/ — everything else (e.g. the
      // catalog root) can 404 normally.
      if (l.pathname.indexOf('/rhacs-ux-prototypes/app') === 0) {
        sessionStorage.setItem(
          'spa_redirect',
          JSON.stringify({ path: l.pathname, search: l.search, hash: l.hash })
        );
        l.replace('/rhacs-ux-prototypes/app/');
      }
    })();
  </script>
</head>
<body></body>
</html>
